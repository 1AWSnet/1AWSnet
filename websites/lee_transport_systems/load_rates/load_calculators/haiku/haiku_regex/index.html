<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haiku Regex</title>
<link rel="stylesheet" href="../../../../css/style.css">
<script src="../../../../js/theme.js"></script>
<script src="../../../../js/header.js"></script>
</head>
<body class="centered-page">

<script>renderSiteHeader('../../../../');</script>

<div class="page">
<h1>🔣 Haiku Regex 🔣</h1>

<div class="controls stacked">
<label class="tab-btn" for="photo">Choose File</label>
<input type="file" id="photo" accept="image/*" class="visually-hidden">
<span id="fileName" class="file-name">No file selected</span>
<button id="upload">Upload &amp; extract</button>
</div>

<div id="status"></div>

<table id="tripsTable">
  <thead>
    <tr><th>Trip &amp;<br>Order #</th><th>Origin</th><th>Destination</th><th>Rate</th></tr>
  </thead>
  <tbody id="tripsBody"></tbody>
</table>
<div id="summary"></div>

<details id="rawDetails" style="display: none;">
  <summary>Raw OCR text <button id="copyRaw" type="button">Copy</button></summary>
  <pre id="result"></pre>
</details>

<details id="previewDetails" style="display: none;">
  <summary>What was actually sent to Claude</summary>
  <img id="normalizedPreview" style="max-width: 100%;">
</details>

</div>

<script src="../../../settlement_tariff/js/data.js"></script>
<script src="../haiku_shared_js/terminals.js"></script>
<script src="../haiku_shared_js/structure.js"></script>
<script src="../haiku_shared_js/dom-helpers.js"></script>
<script src="parse-raw-text.js"></script>
<script>
const fileInput = document.getElementById('photo');
const fileNameEl = document.getElementById('fileName');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const rawDetails = document.getElementById('rawDetails');
const previewDetails = document.getElementById('previewDetails');
const normalizedPreview = document.getElementById('normalizedPreview');
const tripsTable = document.getElementById('tripsTable');
const tripsBody = document.getElementById('tripsBody');
const summaryEl = document.getElementById('summary');

function makeRateCell(trip) {
  const td = document.createElement('td');
  const amount = document.createElement('span');
  amount.className = trip.rate ? 'rate-amount' : 'rate-amount unmatched';
  amount.textContent = trip.rate ? `$${trip.rate.newRate}` : '$??';
  td.appendChild(amount);
  return td;
}

// structureOcrResult() (../haiku_shared_js/structure.js) flags a trip number
// that came up short an LLD or LUL row with its MISSING_ROW placeholder, whose name is
// literally "(missing)". Swap that for a clearer flag here at render time only — no
// change to structure.js needed for that.
function originDisplay(trip) {
  if (trip.origin.name === '(missing)') return ['UNRECOGNIZED!'];
  return trip.origin.terminalLines || [`${trip.origin.name} — ${trip.origin.address}`];
}
function destinationDisplay(trip) {
  if (trip.destination.name === '(missing)') return 'UNRECOGNIZED!';
  return trip.destination.city || `${trip.destination.name} — ${trip.destination.address}`;
}

function renderTrips(structured) {
  tripsBody.innerHTML = '';
  for (const trip of structured.trips) {
    const tr = document.createElement('tr');
    tr.appendChild(makeTripOrderCell(trip.tripNumber, trip.orderNumber));
    tr.appendChild(makeMultilineCell(originDisplay(trip), trip.origin.name === '(missing)' ? 'unmatched' : ''));
    tr.appendChild(makeCell(destinationDisplay(trip), trip.destination.name === '(missing)' ? 'unmatched' : ''));
    tr.appendChild(makeRateCell(trip));
    tripsBody.appendChild(tr);
  }
  tripsTable.style.display = structured.trips.length ? 'table' : 'none';

  const totalText = `Matched total: $${structured.matchedTotal}` +
    (structured.unmatchedCount ? ` (+ ${structured.unmatchedCount} trip(s) with no tariff match)` : '');
  summaryEl.textContent = `${structured.driverName} — ${structured.date}. ${totalText}`;
}

document.getElementById('copyRaw').addEventListener('click', (e) => {
  // Stops the click from also toggling the <details> it sits inside, since the button
  // is part of the <summary> row.
  e.preventDefault();
  e.stopPropagation();
  navigator.clipboard.writeText(resultEl.textContent);
  const btn = e.currentTarget;
  const original = btn.textContent;
  btn.textContent = 'Copied';
  setTimeout(() => { btn.textContent = original; }, 1500);
});

wireFileInput(fileInput, fileNameEl, statusEl);

document.getElementById('upload').addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) {
    statusEl.textContent = 'Photo has not been selected.';
    return;
  }

  startUploadCounter(statusEl);
  resultEl.textContent = '';
  rawDetails.style.display = 'none';
  tripsTable.style.display = 'none';
  summaryEl.textContent = '';

  try {
    const normalized = await normalizeOrientation(file);
    normalizedPreview.src = URL.createObjectURL(normalized);
    previewDetails.style.display = 'block';
    const response = await fetch('/api/ocr-regex', {
      method: 'POST',
      headers: { 'Content-Type': 'image/jpeg' },
      body: normalized,
    });
    stopUploadCounter();

    const text = await response.text();
    resultEl.textContent = text;
    rawDetails.style.display = 'block';

    if (!response.ok) {
      statusEl.textContent = 'Error (' + response.status + ')';
      return;
    }

    statusEl.textContent = 'Done.';
    renderTrips(structureOcrResult(parseRawTextToRows(text)));
  } catch (err) {
    stopUploadCounter();
    statusEl.textContent = 'Request failed.';
    resultEl.textContent = String(err);
    rawDetails.style.display = 'block';
  }
});
</script>

</body>
</html>
