<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haiku Frame</title>
<link rel="stylesheet" href="../../../../css/style.css">
<script src="../../../../js/theme.js"></script>
<script src="../../../../js/header.js"></script>
</head>
<body class="centered-page">

<script>renderSiteHeader('../../../../');</script>

<div class="page">
<h1>🤖 Haiku Frame 🤖</h1>

<div class="controls stacked">
<label class="tab-btn" for="photo">Choose File</label>
<input type="file" id="photo" accept="image/*" class="visually-hidden">
<span id="fileName" class="file-name">No file selected</span>
<button id="upload">Upload &amp; extract</button>
</div>

<div id="status"></div>

<table id="tripsTable">
  <thead>
    <tr><th>Trip &amp;<br>Order #</th><th>Origin</th><th>Destination</th><th>Rate</th></tr>
  </thead>
  <tbody id="tripsBody"></tbody>
</table>
<div id="summary"></div>

<details id="rawDetails" style="display: none;">
  <summary>Raw OCR JSON</summary>
  <pre id="result"></pre>
</details>

</div>

<script src="../../../settlement_tariff/js/data.js"></script>
<script src="../haiku_shared_js/terminals.js"></script>
<script src="../haiku_shared_js/structure.js"></script>
<script src="../haiku_shared_js/dom-helpers.js"></script>
<script>
const fileInput = document.getElementById('photo');
const fileNameEl = document.getElementById('fileName');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const rawDetails = document.getElementById('rawDetails');
const tripsTable = document.getElementById('tripsTable');
const tripsBody = document.getElementById('tripsBody');
const summaryEl = document.getElementById('summary');

function makeRateCell(trip) {
  const td = document.createElement('td');
  if (!trip.rate) {
    td.className = 'unmatched';
    td.textContent = 'No tariff match — verify manually';
    return td;
  }
  const amount = document.createElement('span');
  amount.className = 'rate-amount';
  amount.textContent = `$${trip.rate.newRate}`;
  td.appendChild(amount);
  return td;
}

function renderTrips(structured) {
  tripsBody.innerHTML = '';
  for (const trip of structured.trips) {
    const tr = document.createElement('tr');
    tr.appendChild(makeTripOrderCell(trip.tripNumber, trip.orderNumber));
    const originLines = trip.origin.terminalLines || [`${trip.origin.name} — ${trip.origin.address}`];
    tr.appendChild(makeMultilineCell(originLines));
    tr.appendChild(makeCell(trip.destination.city || `${trip.destination.name} — ${trip.destination.address}`));
    tr.appendChild(makeRateCell(trip));
    tripsBody.appendChild(tr);
  }
  tripsTable.style.display = structured.trips.length ? 'table' : 'none';

  const totalText = `Matched total: $${structured.matchedTotal}` +
    (structured.unmatchedCount ? ` (+ ${structured.unmatchedCount} trip(s) with no tariff match)` : '');
  summaryEl.textContent = `${structured.driverName} — ${structured.date}. ${totalText}`;
}

wireFileInput(fileInput, fileNameEl, statusEl);

document.getElementById('upload').addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) {
    statusEl.textContent = 'Photo has not been selected.';
    return;
  }

  statusEl.textContent = 'Uploading and extracting text... (This normally takes about 5 seconds.)';
  resultEl.textContent = '';
  rawDetails.style.display = 'none';
  tripsTable.style.display = 'none';
  summaryEl.textContent = '';

  try {
    const normalized = await normalizeOrientation(file);
    const response = await fetch('/api/ocr-frame', {
      method: 'POST',
      headers: { 'Content-Type': 'image/jpeg' },
      body: normalized,
    });

    const data = await response.json();
    resultEl.textContent = JSON.stringify(data, null, 2);
    rawDetails.style.display = 'block';

    if (!response.ok) {
      statusEl.textContent = 'Error (' + response.status + ')';
      return;
    }

    statusEl.textContent = 'Done.';
    renderTrips(structureOcrResult(data));
  } catch (err) {
    statusEl.textContent = 'Request failed.';
    resultEl.textContent = String(err);
    rawDetails.style.display = 'block';
  }
});
</script>

</body>
</html>
