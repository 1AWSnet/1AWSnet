<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rate Table</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2 id="title">Rate Table</h2>
<button class="toggle-btn" onclick="toggleTheme()" id="themeBtn">Switch to<br>Light Mode</button>

<div class="rate-row">
  <label for="hourlyRate">Hourly Rate</label>
  <input id="hourlyRate" type="number" value="35" step="any" oninput="render()">
</div>

<div style="display: inline-block;">
<table>
  <thead>
    <tr><th>Miles</th><th>Rounded<br>Rate</th><th>CPM</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<p id="disclaimer" style="font-size: 13px; color: var(--disclaimer); margin-top: 20px; box-sizing: border-box; text-align: left;">
Disclaimer: This table uses a very specific formula to calculate the aproximate speed of a tractor trailer.<br><br>The table also assumes 30 minutes to load and 30 minutes to unload.
</p>
</div>

<script src="js/theme.js"></script>
<script src="js/logic.js"></script>

</body>
</html>
