<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settlement Tariff</title>
<link rel="stylesheet" href="../../css/style.css">
<script src="../../js/theme.js"></script>
<script src="../../js/header.js"></script>
</head>
<body class="tariff-page">

<div class="page">

<button class="chrome-toggle" id="chromeToggle" type="button"
        onclick="toggleChrome()" aria-expanded="false" aria-controls="chromePanel"><span class="chev">&#9662;</span> Menu <span class="chev">&#9662;</span></button>

<div class="chrome-panel" id="chromePanel" hidden>
  <script>renderSiteHeader('../../', true, 'Settlement Tariff');</script>

  <div class="tabs">
    <button class="tab-btn" data-tariff="0" onclick="switchTariff(0)">CT</button>
    <button class="tab-btn active" data-tariff="2" onclick="switchTariff(2)">All States</button>
    <button class="tab-btn" data-tariff="1" onclick="switchTariff(1)">MA</button>
  </div>

  <div class="tabs">
    <label class="switch-wrap">
      <span>Show Old Rates</span>
      <input type="checkbox" id="showOldRate" onchange="toggleOldRate()">
      <span class="switch-track"><span class="switch-thumb"></span></span>
    </label>
  </div>
</div>

<div class="search-bar">
  <div class="controls">
    <div>
      <input id="originFilter" type="search" oninput="render()" aria-label="Filter by origin"
             placeholder="Origin (First 3 letters)"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             data-lpignore="true" data-1p-ignore data-form-type="other">
    </div>
    <div>
      <input id="destFilter" type="search" oninput="render()" aria-label="Filter by destination"
             placeholder="Dest. (First 3 letters)"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             data-lpignore="true" data-1p-ignore data-form-type="other">
    </div>
  </div>
  <p class="count" id="rowCount"></p>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th data-col="0">Origin</th>
      <th data-col="1">Destination</th>
      <th data-col="2">Old Rate</th>
      <th data-col="3">New Rate</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>
</div>

<script src="js/data.js"></script>
<script src="js/logic.js"></script>

</body>
</html>
