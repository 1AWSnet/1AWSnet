<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settlement Tariff</title>
<link rel="stylesheet" href="../../css/style.css">
<script src="../../js/theme.js"></script>
<script src="../../js/header.js"></script>
</head>
<body>

<script>renderSiteHeader('../../');</script>

<div class="page">
<h1>Settlement Tariff</h1>

<div class="tabs">
  <button class="tab-btn" onclick="switchTariff(0)">CT Pay Rates A-Z (232)</button>
  <button class="tab-btn" onclick="switchTariff(1)">Maine-Mass-NewHamp-RhodeIsland (237)</button>
  <button class="tab-btn active" onclick="switchTariff(2)">CT + MA<br>&amp; Others</button>
</div>

<div class="tabs">
  <label class="switch-wrap">
    <span>Show Old Rates</span>
    <input type="checkbox" id="showOldRate" onchange="toggleOldRate()">
    <span class="switch-track"><span class="switch-thumb"></span></span>
  </label>
</div>

<div class="sticky-search">
  <div class="controls">
    <div>
      <label for="originFilter">Origin city:</label><br>
      <input id="originFilter" type="text" oninput="render()" placeholder="e.g. New Haven">
    </div>
    <div>
      <label for="destFilter">Destination city:</label><br>
      <input id="destFilter" type="text" oninput="render()" placeholder="e.g. Hartford">
    </div>
  </div>
  <p class="count" id="rowCount"></p>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th data-col="0">Origin City</th>
      <th data-col="1">Destination City</th>
      <th data-col="2">Old Rate</th>
      <th data-col="3">New Rate</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>
</div>

<script src="js/data.js"></script>
<script src="js/logic.js"></script>

</body>
</html>
