<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=5">
<title>Rate Table</title>
<link rel="stylesheet" href="../../css/style.css">
<script src="../../js/theme.js"></script>
<script src="../../js/header.js"></script>
</head>
<body>

<script>renderSiteHeader('../../');</script>

<div class="page">
<h2 id="title">Rate Table</h2>

<div class="rate-row">
  <label for="hourlyRate">Hourly Rate</label>
  <input id="hourlyRate" type="number" value="35" step="any" oninput="render()">
</div>

<div class="table-wrap">
<table class="tight-table">
  <thead>
    <tr><th>Miles</th><th>Rounded<br>Rate</th><th>CPM</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<p id="disclaimer" class="sub" style="margin-top: 20px; box-sizing: border-box; text-align: left;">
Disclaimer: This table uses a very specific formula to calculate the aproximate speed of a tractor trailer.<br><br>The table also assumes 30 minutes to load and 30 minutes to unload.
</p>
</div>
</div>

<script src="js/logic.js"></script>

</body>
</html>
